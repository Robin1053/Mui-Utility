name: Version bump

# Setzt bei jeder PR auf main die Version in package.json passend zum
# Release-Label (major / minor / patch / no-release) und pusht den
# Bump-Commit direkt in den PR-Branch. Ohne Label schlaegt der Check fehl.

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: version-bump-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Fork-PRs koennen nicht beschrieben werden
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::PR kommt aus einem Fork. Bitte die Version manuell setzen."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          fetch-tags: true
          # Optional: Secret RELEASE_TOKEN (PAT / App-Token) anlegen, damit der
          # Bump-Commit die CI erneut ausloest. Mit github.token passiert das nicht.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: ./.github/actions/label-bump
        id: bump

      - name: Bump committen und in den PR-Branch pushen
        if: steps.bump.outputs.changed == 'true'
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          PART: ${{ steps.bump.outputs.part }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): $TAG ($PART)"
          git push origin "HEAD:$BRANCH"

      - name: Zusammenfassung
        env:
          PART: ${{ steps.bump.outputs.part }}
          PREVIOUS: ${{ steps.bump.outputs.previous }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          {
            echo "### Version bump"
            echo "| Label | Letzter Tag | Neue Version |"
            echo "|---|---|---|"
            echo "| $PART | $PREVIOUS | $VERSION |"
          } >> "$GITHUB_STEP_SUMMARY"
