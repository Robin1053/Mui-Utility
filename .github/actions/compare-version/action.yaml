name: Compare version against latest tag
description: >
  Vergleicht die Version aus package.json mit dem neuesten Release-Tag
  (Prefix, SemVer major.minor.patch). Setzt voraus, dass der Aufrufer
  vorher schon mit fetch-depth 0 und fetch-tags ausgecheckt hat.

inputs:
  tag-prefix:
    description: Prefix der Release-Tags
    default: V

outputs:
  higher:
    description: "true, wenn die package.json-Version hoeher ist als der letzte Tag"
    value: ${{ steps.compare.outputs.higher }}
  current:
    description: Aktuelle Version aus package.json
    value: ${{ steps.compare.outputs.current }}
  latest:
    description: Version des letzten Release-Tags
    value: ${{ steps.compare.outputs.latest }}
  tag:
    description: Tag-Name zur aktuellen Version
    value: ${{ inputs.tag-prefix }}${{ steps.compare.outputs.current }}

runs:
  using: composite
  steps:
    # Werte gehen als env rein statt direkt in den Skript-String interpoliert
    # zu werden -> kein Injection-Risiko ueber Versionsstrings.
    - name: Versionen vergleichen
      id: compare
      shell: bash
      env:
        PREFIX: ${{ inputs.tag-prefix }}
        SEMVER: ${{ github.workspace }}/.github/scripts/semver.mjs
      run: |
        CURRENT=$(node -p "require('./package.json').version")
        LATEST=$(node "$SEMVER" latest "$PREFIX")
        HIGHER=$(node "$SEMVER" gt "$CURRENT" "$LATEST")
        {
          echo "current=$CURRENT"
          echo "latest=$LATEST"
          echo "higher=$HIGHER"
        } >> "$GITHUB_OUTPUT"
        echo "package.json: $CURRENT | letzter Tag: $PREFIX$LATEST | hoeher: $HIGHER"
